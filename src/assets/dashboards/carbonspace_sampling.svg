    <rect x="78" y="78" width="34" height="34" rx="3" fill="#10b981" opacity="0.45"/>
    <rect x="116" y="78" width="34" height="34" rx="3" fill="#34d399" opacity="0.7"/>
    <rect x="154" y="78" width="34" height="34" rx="3" fill="#10b981" opacity="0.3"/>
    <rect x="40" y="116" width="34" height="34" rx="3" fill="#34d399" opacity="0.55"/>
